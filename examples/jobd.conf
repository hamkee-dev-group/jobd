# jobd configuration
#
# Every setting here is optional.  Component binaries are looked up in this
# order:
#
#   1. --component NAME=PATH on the jobd command line
#   2. an entry in this file
#   3. the environment variable JOBD_<NAME>   (e.g. JOBD_CGROUPCTL)
#   4. the search path: JOBD_COMPONENT_PATH if set, otherwise the
#      directory containing the jobd binary, followed by
#      $PREFIX/libexec/jobd, $PREFIX/bin, $PREFIX/sbin, /usr/local/bin,
#      /usr/local/sbin, /usr/bin, /usr/sbin, /bin and /sbin.
#
# Step 4 finds each sibling project where its own `make install` puts it,
# so an installed system usually needs no entries at all.  Run
# `jobctl doctor` to see what was resolved.

# --- component locations (absolute paths) ---------------------------------
# cgroupd    = /usr/local/bin/cgroupd
# cgroupctl  = /usr/local/bin/cgroupctl
# overlayd   = /usr/local/bin/overlayd
# sandbox    = /usr/local/bin/sandbox
# landlockd  = /usr/local/bin/landlockd
# fanotifyd  = /usr/local/bin/fanotifyd
# memfdbus   = /usr/local/bin/memfdbus
# iouringd   = /usr/local/bin/iouringd
# job-init   = /usr/local/libexec/jobd/job-init

# Or point the search at an uninstalled build tree:
# component_path = /opt/hamkee/cgroupd/build:/opt/hamkee/landlock/build/src

# --- paths ----------------------------------------------------------------
# socket      = /run/jobd/jobd.sock
# runtime_dir = /run/jobd
# state_dir   = /var/lib/jobd
# cgroup_sock = /run/jobd/cgroupd.sock
# cgroup_root = /sys/fs/cgroup/jobd.slice

# --- access control -------------------------------------------------------
# jobd runs jobs as root, so the control socket is an authorisation
# boundary.  Connections are checked with SO_PEERCRED against these lists.
# The default is root only.
# allow_uid = 0
# allow_gid = the numeric gid of a trusted operators group

# --- optional components --------------------------------------------------
# Sidecars only start when a job asks for them, so a job that requests
# nothing here runs with none of their code.  These keys let the operator
# refuse the request outright, so a locked-down daemon can guarantee the
# component is never reachable no matter what a client sends.
# Accepted values: yes/no, true/false, on/off, 1/0.  All default to yes.
# allow_iouring  = yes
# allow_network  = yes
# allow_fanotify = yes
# allow_memfd    = yes
